<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai H - ML Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0a1a2e,#1e2a44,#ffd70022);color:#fff;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:30px}
header .logo{max-width:120px}
header h1{font-size:2.5em;color:#ffd700;margin:15px 0;font-weight:600}
header p{color:#d1d5db}
.checker{background:rgba(255,255,255,0.1);padding:25px;border-radius:8px;border:2px solid #ffd700;max-width:400px;width:100%;text-align:center}
.checker h2{color:#ffd700;margin-bottom:20px}
label{display:block;margin:12px 0 5px;text-align:left;color:#d1d5db}
input{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ffd700;border-radius:8px;background:#2a3b5a;color:#fff;font-size:1em}
button{width:100%;padding:13px;background:#ffd700;color:#0a1a2e;border:none;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer}
button:disabled{background:#6b7280}
#result{margin-top:20px;padding:15px;border-radius:8px;display:none;text-align:left}
#result.success{display:block;background:rgba(16,185,129,0.15);border:1px solid #10b981;color:#a7f3d0}
#result.error{display:block;background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#fca5a5}
.nickname{font-size:1.3em;font-weight:700;color:#ffd700;margin-bottom:8px}
.back-button{display:inline-block;margin-top:30px;padding:12px 24px;background:#1e2a44;color:#fff;border:2px solid #ffd700;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<header>
<img src="https://raw.githubusercontent.com/hzbllh/games/5d830487edd8f40dc38d6fefcfa2b211eb12f3ee/H_20250228_033418_0002.png" class="logo" alt="Logo">
<h1>ML Checker</h1>
<p>Semak Nickname & Region akaun Mobile Legends</p>
</header>

<div class="checker">
<h2>Check ID MLBB</h2>
<label>User ID</label>
<input type="text" id="userId" placeholder="Contoh: 123456789">
<label>Zone ID (Server)</label>
<input type="text" id="zoneId" placeholder="Contoh: 1234">
<button id="checkBtn" onclick="checkAccount()">Check Sekarang</button>
<div id="result"></div>
</div>

<a href="index.html" class="back-button">← Kembali ke Halaman Utama</a>

<script>
function checkAccount() {
    var userId = document.getElementById("userId").value.trim();
    var zoneId = document.getElementById("zoneId").value.trim();
    var resultDiv = document.getElementById("result");
    var btn = document.getElementById("checkBtn");

    resultDiv.style.display = "none";
    resultDiv.className = "";
    resultDiv.innerHTML = "";

    if (!userId || !zoneId) {
        showError("Sila masukkan User ID dan Zone ID.");
        return;
    }

    // Check nombor sahaja (cara paling mudah)
    if (isNaN(userId) || isNaN(zoneId)) {
        showError("User ID dan Zone ID mesti nombor sahaja.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Sedang check...";

    var url = "https://api.isan.eu.org/nickname/ml?id=" + userId + "&server=" + zoneId;

    fetch(url)
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {
        if (data.success && data.name) {
            var html = '<div class="nickname">' + data.name + '</div>';
            html += '<div>User ID: <strong>' + userId + '</strong></div>';
            html += '<div>Zone ID: <strong>' + zoneId + '</strong></div>';
            if (data.country) {
                html += '<div>Negara: <strong>' + data.country + '</strong></div>';
            }
            html += '<div style="margin-top:8px">✓ Akaun dijumpai</div>';

            resultDiv.className = "success";
            resultDiv.innerHTML = html;
            resultDiv.style.display = "block";
        } else {
            showError("Akaun tidak dijumpai. Sila semak User ID & Zone ID.");
        }
    })
    .catch(function(err) {
        showError("Gagal connect ke server. Cuba lagi.");
    })
    .finally(function() {
        btn.disabled = false;
        btn.innerText = "Check Sekarang";
    });
}

function showError(msg) {
    var resultDiv = document.getElementById("result");
    resultDiv.className = "error";
    resultDiv.innerHTML = msg;
    resultDiv.style.display = "block";
}
</script>
</body>
</html>
